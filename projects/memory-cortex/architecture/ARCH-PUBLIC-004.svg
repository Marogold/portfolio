<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1400" viewBox="0 0 1200 1400" font-family="Inter, 'Segoe UI', 'Liberation Sans', 'DejaVu Sans', Arial, sans-serif"><defs><marker id="a3b4a5a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0L10,5L0,10z" fill="#3b4a5a"/></marker><marker id="s3b4a5a" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#3b4a5a"/></marker><marker id="a2f7d46" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0L10,5L0,10z" fill="#2f7d46"/></marker><marker id="s2f7d46" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2f7d46"/></marker><marker id="a7b4fc4" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0L10,5L0,10z" fill="#7b4fc4"/></marker><marker id="s7b4fc4" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#7b4fc4"/></marker><marker id="a2b6cb0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0L10,5L0,10z" fill="#2b6cb0"/></marker><marker id="s2b6cb0" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2b6cb0"/></marker></defs><rect width="1200" height="1400" fill="#fff"/><text x="48" y="100" font-size="62" font-weight="800" fill="#123524" text-anchor="start">Memory-Cortex</text><text x="50" y="142" font-size="27" font-weight="500" fill="#52606d" text-anchor="start">Architecture de la couche mémoire projet</text><text x="50" y="170" font-size="17" font-weight="400" fill="#52606d" text-anchor="start">Une mémoire versionnée, lisible par tout agent</text><rect x="40" y="200" width="1120" height="100" rx="16" fill="#f3f5f7" stroke="#d3dae1" stroke-width="1.6"/><text x="64" y="246" font-size="22" font-weight="800" fill="#2b3540" text-anchor="start">Agents de développement</text><text x="64" y="274" font-size="15" font-weight="400" fill="#52606d" text-anchor="start">Interchangeables, quel que soit l’outil</text><rect x="400" y="215" width="740" height="70" rx="14" fill="#ffffff" stroke="#cfd8e0" stroke-width="1.6"/><g transform="translate(420 233) scale(1.4166666666666667)" fill="none" stroke="#4a5866" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="8" width="16" height="11" rx="3"/><path d="M12 8V5M9 13h.01M15 13h.01M9 16h6"/><circle cx="12" cy="3.8" r="1.2"/></g><text x="472" y="246" font-size="17.5" font-weight="700" fill="#2b3540" text-anchor="start">Trois opérations seulement</text><text x="472" y="266" font-size="14.5" font-weight="400" fill="#52606d" text-anchor="start">contexte · rappel · mémorisation, sans accès direct à l’index</text><path d="M600,300 V350" fill="none" stroke="#3b4a5a" stroke-width="2.4" marker-end="url(#a3b4a5a)"/><rect x="40" y="350" width="1120" height="120" rx="16" fill="#fdf1de" stroke="#efcf9d" stroke-width="1.6"/><text x="64" y="396" font-size="22" font-weight="800" fill="#8a5210" text-anchor="start">Façade mémoire</text><text x="64" y="424" font-size="15" font-weight="400" fill="#52606d" text-anchor="start">Un seul contrat, backends cachés</text><rect x="400" y="361" width="740" height="98" rx="14" fill="#ffffff" stroke="#cfd8e0" stroke-width="1.6"/><g transform="translate(420 393) scale(1.4166666666666667)" fill="none" stroke="#c47a1c" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="7" rx="2"/><rect x="3" y="14" width="18" height="7" rx="2"/><path d="M7 6.5h.01M7 17.5h.01"/></g><text x="472" y="396" font-size="17.5" font-weight="700" fill="#8a5210" text-anchor="start">Contrat unique devant les backends</text><text x="472" y="416" font-size="14.5" font-weight="400" fill="#52606d" text-anchor="start">Injecte le projet depuis le registre · portées globale et projet</text><text x="472" y="436" font-size="14.5" font-weight="400" fill="#52606d" text-anchor="start">Si indisponible : repli en lecture directe des fichiers</text><path d="M300,470 V520" fill="none" stroke="#2f7d46" stroke-width="2.4" marker-end="url(#a2f7d46)"/><path d="M900,470 V520" fill="none" stroke="#7b4fc4" stroke-width="2.4" marker-end="url(#a7b4fc4)"/><text x="312" y="502" font-size="13" font-weight="700" fill="#2f7d46" text-anchor="start">contraintes dures (lecture)</text><text x="912" y="502" font-size="13" font-weight="700" fill="#7b4fc4" text-anchor="start">indices de rappel (lecture)</text><rect x="40" y="520" width="520" height="490" rx="16" fill="#eaf5ec" stroke="#b9d9c0" stroke-width="1.6"/><g transform="translate(62 540) scale(1.8333333333333333)" fill="none" stroke="#2f7d46" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M2 5h6a4 4 0 0 1 4 4v12a3 3 0 0 0-3-3H2z"/><path d="M22 5h-6a4 4 0 0 0-4 4v12a3 3 0 0 1 3-3h7z"/></g><text x="120" y="566" font-size="26" font-weight="800" fill="#1f5a32" text-anchor="start">Mémoire symbolique</text><text x="120" y="592" font-size="15" font-weight="400" fill="#52606d" text-anchor="start">Markdown versionné dans Git</text><rect x="441.2" y="544" width="96.8" height="28" rx="14" fill="#2f7d46"/><text x="489.6" y="563" font-size="12.5" font-weight="800" fill="#fff" text-anchor="middle">FAIT FOI</text><rect x="65" y="625" width="470" height="100" rx="14" fill="#ffffff" stroke="#cfd8e0" stroke-width="1.6"/><g transform="translate(85 658) scale(1.4166666666666667)" fill="none" stroke="#2f7d46" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/></g><text x="137" y="661" font-size="17.5" font-weight="700" fill="#1f5a32" text-anchor="start">Mémoire du projet</text><text x="137" y="681" font-size="14.5" font-weight="400" fill="#52606d" text-anchor="start">Dans chaque dépôt : contraintes, décisions,</text><text x="137" y="701" font-size="14.5" font-weight="400" fill="#52606d" text-anchor="start">notes d’exploitation, glossaire</text><path d="M300,725 V765" fill="none" stroke="#2f7d46" stroke-width="2.4" marker-end="url(#a2f7d46)"/><text x="312" y="751" font-size="13" font-weight="700" fill="#2f7d46" text-anchor="start">promotion par PR</text><rect x="65" y="765" width="470" height="100" rx="14" fill="#ffffff" stroke="#cfd8e0" stroke-width="1.6"/><g transform="translate(85 798) scale(1.4166666666666667)" fill="none" stroke="#2f7d46" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></g><text x="137" y="801" font-size="17.5" font-weight="700" fill="#1f5a32" text-anchor="start">Mémoire globale</text><text x="137" y="821" font-size="14.5" font-weight="400" fill="#52606d" text-anchor="start">Principes et préférences transverses</text><text x="137" y="841" font-size="14.5" font-weight="400" fill="#52606d" text-anchor="start">Promotion depuis un projet si avéré dans 3 projets</text><rect x="65" y="905" width="470" height="90" rx="14" fill="#ffffff" stroke="#cfd8e0" stroke-width="1.6"/><g transform="translate(85 933) scale(1.4166666666666667)" fill="none" stroke="#2f7d46" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M8.5 12l2.5 2.5 4.5-5"/></g><text x="137" y="946" font-size="17.5" font-weight="700" fill="#1f5a32" text-anchor="start">Registre et politiques</text><text x="137" y="966" font-size="14.5" font-weight="400" fill="#52606d" text-anchor="start">Projets déclarés · schémas · promotion · rétention</text><rect x="640" y="520" width="520" height="490" rx="16" fill="#f0eafb" stroke="#cdbbee" stroke-width="1.6"/><g transform="translate(662 540) scale(1.8333333333333333)" fill="none" stroke="#7b4fc4" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></g><text x="720" y="566" font-size="26" font-weight="800" fill="#53309a" text-anchor="start">Index de rappel</text><text x="720" y="592" font-size="15" font-weight="400" fill="#52606d" text-anchor="start">Dérivé de Git, jamais source de vérité</text><rect x="972.4" y="544" width="165.6" height="28" rx="14" fill="#7b4fc4"/><text x="1055.2" y="563" font-size="12.5" font-weight="800" fill="#fff" text-anchor="middle">DÉRIVÉ · JETABLE</text><rect x="665" y="625" width="470" height="100" rx="14" fill="#ffffff" stroke="#cfd8e0" stroke-width="1.6"/><g transform="translate(685 658) scale(1.4166666666666667)" fill="none" stroke="#7b4fc4" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></g><text x="737" y="661" font-size="17.5" font-weight="700" fill="#53309a" text-anchor="start">Recherche lexicale</text><text x="737" y="681" font-size="14.5" font-weight="400" fill="#52606d" text-anchor="start">Fonctionne hors ligne, sans infrastructure :</text><text x="737" y="701" font-size="14.5" font-weight="400" fill="#52606d" text-anchor="start">le plancher du système</text><rect x="665" y="765" width="470" height="100" rx="14" fill="#ffffff" stroke="#cfd8e0" stroke-width="1.6"/><g transform="translate(685 798) scale(1.4166666666666667)" fill="none" stroke="#7b4fc4" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4a3 3 0 0 0-5.5 1.5A3.5 3.5 0 0 0 4 9a3.5 3.5 0 0 0 1.5 3A3.5 3.5 0 0 0 7 17.5a3 3 0 0 0 5 2z"/><path d="M12 4a3 3 0 0 1 5.5 1.5A3.5 3.5 0 0 1 20 9a3.5 3.5 0 0 1-1.5 3 3.5 3.5 0 0 1-1.5 5.5 3 3 0 0 1-5 2z"/><path d="M12 4v16M8 10h4M12 14h4"/></g><text x="737" y="801" font-size="17.5" font-weight="700" fill="#53309a" text-anchor="start">Recherche vectorielle</text><text x="737" y="821" font-size="14.5" font-weight="400" fill="#52606d" text-anchor="start">Sémantique, ajoutée par-dessus</text><text x="737" y="841" font-size="14.5" font-weight="400" fill="#52606d" text-anchor="start">sans changer le contrat</text><rect x="665" y="905" width="470" height="90" rx="14" fill="#ffffff" stroke="#cfd8e0" stroke-width="1.6"/><g transform="translate(685 933) scale(1.4166666666666667)" fill="none" stroke="#7b4fc4" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="6.5"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M18.7 5.3l-2.1 2.1M7.4 16.6l-2.1 2.1"/></g><text x="737" y="946" font-size="17.5" font-weight="700" fill="#53309a" text-anchor="start">Backends remplaçables</text><text x="737" y="966" font-size="14.5" font-weight="400" fill="#52606d" text-anchor="start">Les agents ignorent leur existence</text><path d="M640,700 H563" fill="none" stroke="#3b4a5a" stroke-width="2.4" marker-end="url(#a3b4a5a)"/><text x="600" y="664" font-size="13" font-weight="700" fill="#52606d" text-anchor="middle">dérivé de</text><text x="600" y="680" font-size="13" font-weight="700" fill="#52606d" text-anchor="middle">Git</text><text x="40" y="1062" font-size="20" font-weight="800" fill="#2b3540" text-anchor="start">Chemin d’écriture</text><rect x="40" y="1085" width="200" height="125" rx="14" fill="#fff6cc" stroke="#e0c96a" stroke-width="1.6"/><g transform="translate(58 1099) scale(1.3333333333333333)" fill="none" stroke="#a67c00" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="8" width="16" height="11" rx="3"/><path d="M12 8V5M9 13h.01M15 13h.01M9 16h6"/><circle cx="12" cy="3.8" r="1.2"/></g><text x="58" y="1159" font-size="17" font-weight="700" fill="#6f5700" text-anchor="start">Agent propose</text><text x="58" y="1181" font-size="14" font-weight="400" fill="#52606d" text-anchor="start">il écrit du Markdown,</text><text x="58" y="1200" font-size="14" font-weight="400" fill="#52606d" text-anchor="start">jamais dans l’index</text><rect x="270" y="1085" width="200" height="125" rx="14" fill="#fff" stroke="#cfd8e0" stroke-width="1.6"/><g transform="translate(288 1099) scale(1.3333333333333333)" fill="none" stroke="#4a5866" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/></g><text x="288" y="1159" font-size="17" font-weight="700" fill="#2b3540" text-anchor="start">Fichier Markdown</text><text x="288" y="1181" font-size="14" font-weight="400" fill="#52606d" text-anchor="start">une proposition,</text><text x="288" y="1200" font-size="14" font-weight="400" fill="#52606d" text-anchor="start">donc un diff relisible</text><rect x="500" y="1085" width="200" height="125" rx="14" fill="#fff" stroke="#6b7785" stroke-width="2.4"/><g transform="translate(518 1099) scale(1.3333333333333333)" fill="none" stroke="#4a5866" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="4"/><path d="M2 21v-1a6 6 0 0 1 6-6h2"/><path d="M15 17l2.5 2.5L22 14"/></g><text x="518" y="1159" font-size="17" font-weight="700" fill="#2b3540" text-anchor="start">Revue en diff</text><text x="518" y="1181" font-size="14" font-weight="400" fill="#52606d" text-anchor="start">humaine, puis fusion</text><rect x="730" y="1085" width="200" height="125" rx="14" fill="#fff" stroke="#cfd8e0" stroke-width="1.6"/><g transform="translate(748 1099) scale(1.3333333333333333)" fill="none" stroke="#2f7d46" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"/></g><text x="748" y="1159" font-size="17" font-weight="700" fill="#1f5a32" text-anchor="start">Validation CI</text><text x="748" y="1181" font-size="14" font-weight="400" fill="#52606d" text-anchor="start">schémas et doublons</text><rect x="960" y="1085" width="200" height="125" rx="14" fill="#fff" stroke="#cfd8e0" stroke-width="1.6"/><g transform="translate(978 1099) scale(1.3333333333333333)" fill="none" stroke="#7b4fc4" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v6c0 1.7 3.6 3 8 3s8-1.3 8-3V6M4 12v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/></g><text x="978" y="1159" font-size="17" font-weight="700" fill="#53309a" text-anchor="start">Réindexation</text><text x="978" y="1181" font-size="14" font-weight="400" fill="#52606d" text-anchor="start">reconstruction</text><text x="978" y="1200" font-size="14" font-weight="400" fill="#52606d" text-anchor="start">complète possible</text><path d="M240,1147 H270" fill="none" stroke="#3b4a5a" stroke-width="2.4" marker-end="url(#a3b4a5a)"/><path d="M470,1147 H500" fill="none" stroke="#3b4a5a" stroke-width="2.4" marker-end="url(#a3b4a5a)"/><path d="M700,1147 H730" fill="none" stroke="#3b4a5a" stroke-width="2.4" marker-end="url(#a3b4a5a)"/><path d="M930,1147 H960" fill="none" stroke="#3b4a5a" stroke-width="2.4" marker-end="url(#a3b4a5a)"/><path d="M530,1085 V1012" fill="none" stroke="#2f7d46" stroke-width="2.4" marker-end="url(#a2f7d46)"/><text x="542" y="1050" font-size="13" font-weight="700" fill="#2f7d46" text-anchor="start">fait foi après fusion</text><path d="M1060,1085 V1012" fill="none" stroke="#7b4fc4" stroke-width="2.4" marker-end="url(#a7b4fc4)"/><text x="1072" y="1050" font-size="13" font-weight="700" fill="#7b4fc4" text-anchor="start">alimente l’index</text><rect x="40" y="1260" width="1120" height="90" rx="14" fill="#eef1f4" stroke="#d3dae1" stroke-width="1.6"/><text x="600" y="1298" font-size="21" font-weight="700" fill="#1c2733" text-anchor="middle">Git fait foi. L’index est dérivé et jetable.</text><text x="600" y="1328" font-size="17" font-weight="400" fill="#52606d" text-anchor="middle">Les agents proposent du Markdown ; un humain relit le diff avant fusion.</text></svg>